[package]
name = "lv2-host"
version = "0.1.0"
description = "LV2 plugin discovery and native UI hosting"
license = "MIT OR Apache-2.0"
edition = "2024"
publish = false

[build-dependencies]
cc = "1.5"
pkg-config = "0.3"

[dependencies]
libloading = "0.9"
livi = "0.7.5"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.21"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.19"
